version: "3"

tasks:
  build:
    desc: Build the production core process
    cmds:
      - mkdir -p bin
      - go build -o bin/monitra ./cmd/monitra

  test:
    desc: Run fast Go tests
    cmds:
      - go test ./...

  test:web:
    desc: Run browser bootstrap and TypeScript transport tests
    cmds:
      - pnpm test:web

  build:web:
    desc: Build the production browser application
    cmds:
      - pnpm web:build

  production:build:
    desc: Build the production core and Caddy images
    cmds:
      - docker compose --env-file "${MONITRA_PRODUCTION_ENV_FILE:-deployment/production.env}" --file compose.production.yaml build

  production:up:
    desc: Start the production PostgreSQL, core, and Caddy stack
    cmds:
      - docker compose --env-file "${MONITRA_PRODUCTION_ENV_FILE:-deployment/production.env}" --file compose.production.yaml up --detach --build --wait --wait-timeout 90

  production:down:
    desc: Stop the production stack while preserving deployment data
    cmds:
      - docker compose --env-file "${MONITRA_PRODUCTION_ENV_FILE:-deployment/production.env}" --file compose.production.yaml down

  production:diagnose:
    desc: Show production service state and recent logs
    cmds:
      - docker compose --env-file "${MONITRA_PRODUCTION_ENV_FILE:-deployment/production.env}" --file compose.production.yaml ps --all
      - docker compose --env-file "${MONITRA_PRODUCTION_ENV_FILE:-deployment/production.env}" --file compose.production.yaml logs --timestamps --tail 100

  test:production:
    desc: Build and verify the production startup loop in an isolated stack
    cmds:
      - sh scripts/test-production-stack.sh

  test:production:database-lifecycle:
    desc: Verify production PostgreSQL startup failure and runtime recovery
    cmds:
      - bash scripts/test-production-database-lifecycle.sh

  test:e2e:
    desc: Verify browser startup behavior against an isolated production stack
    cmds:
      - pnpm exec playwright install chromium
      - sh scripts/test-playwright-startup.sh

  api:generate:
    desc: Generate TypeScript transport types and client from OpenAPI
    cmds:
      - pnpm api:generate

  api:check:
    desc: Validate OpenAPI and reject generated TypeScript drift
    cmds:
      - bash scripts/check-generated-api.sh

  test:integration:
    desc: Run real PostgreSQL and subprocess startup tests
    cmds:
      - go test -tags=integration ./tests/startup -count=1

  check:format:
    desc: Reject unformatted Go production and test source
    cmds:
      - |
        unformatted="$(gofmt -l cmd internal tests)"
        test -z "$unformatted"

  test:authoritative-gate:
    desc: Prove the authoritative runner executes every step and propagates failures
    cmds:
      - bash scripts/test-authoritative-gate.sh

  check:go:
    desc: Run Go static analysis and tests
    cmds:
      - go vet -tags=integration ./...
      - go test ./...

  check:web:
    desc: Typecheck, test, and production-build the browser application
    cmds:
      - pnpm typecheck
      - pnpm test:web
      - pnpm web:build

  test:production:artifact-fixtures:
    desc: Prove the production artifact checker rejects contaminated fixtures
    cmds:
      - bash scripts/test-production-artifact-check.sh

  test:production:artifacts:
    desc: Inspect the production images built by the browser acceptance
    cmds:
      - bash scripts/check-production-images.sh monitra-core:ticket06-test monitra-web:ticket06-test

  check:
    desc: Run the sole authoritative local and CI quality gate
    cmds:
      - bash scripts/run-authoritative-gate.sh

  demo:startup:
    desc: Demonstrate the typed handshake, PostgreSQL recovery, and bounded initial failure
    cmds:
      - bash scripts/startup-demo.sh
