version: "3"

tasks:
  build:
    desc: Build the production core process
    cmds:
      - mkdir -p bin
      - go build -o bin/monitra ./cmd/monitra

  test:
    desc: Run fast Go tests
    cmds:
      - go test ./...

  test:integration:
    desc: Run real PostgreSQL and subprocess startup tests
    cmds:
      - go test -tags=integration ./tests/startup -count=1

  check:
    desc: Run the authoritative checks available through ticket 02
    cmds:
      - |
        unformatted="$(gofmt -l cmd internal tests)"
        test -z "$unformatted"
      - go vet -tags=integration ./...
      - go test ./...
      - go test -tags=integration ./tests/startup -count=1

  demo:startup:
    desc: Demonstrate PostgreSQL startup, runtime recovery, and bounded initial failure
    cmds:
      - bash scripts/startup-demo.sh
